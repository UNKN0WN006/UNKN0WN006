name: Update 365-Day Orbit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: write

jobs:
  orbit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate contribution orbit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_orbit_graph.py

      - name: Commit updated orbit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/orbit-contributions.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update 365-day contribution orbit"
          git push
